name: trab02_2026_2_12621cbs213

services:
  inventario:
    build: .
    image: trab02_2026_2_12621cbs213:latest
    container_name: trab02_2026_2_12621cbs213
    ports:
      - "2213:5000"
    environment:
      DADOS_DIR: /dados
      NVD_API_KEY: ${NVD_API_KEY:-}
    volumes:
      - dados:/dados
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  dados:
    name: trab02_2026_2_12621cbs213_dados